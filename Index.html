<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <title>給料計算ツール</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            *{box-sizing:border-box;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
            body{margin:0;background:#fff;color:#0f172a;overscroll-behavior-y:contain}
            .tabular-nums{font-variant-numeric:tabular-nums}
            .panel-anim{transition:transform .5s ease-out,opacity .5s ease-in-out}
            .panel-open{transform:translateY(0);opacity:1;pointer-events:auto}
            .panel-entering{transform:translateY(-28px);opacity:0;pointer-events:none}
            .panel-closing{transform:translateY(0);opacity:0;pointer-events:none}
            .backdrop-anim{transition:opacity .5s ease-in-out}
            .slim-scroll::-webkit-scrollbar{width:4px}
            .slim-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}

            body{margin:0;background:#fff;color:#0f172a;overscroll-behavior-y:contain}
            .swipe-area{touch-action:pan-y}
        </style>
    </head>
    <body class="bg-white text-slate-900 select-none">
        <div id="app" class="max-w-md mx-auto min-h-screen bg-white relative flex flex-col pb-40"></div>
        <script>
            const STORAGE_KEY="shift_calc_10th_ok";
            const nthW=(y,m,w,n)=>1+((w-new Date(y,m-1,1).getDay()+7)%7)+(n-1)*7;
            const vEq=y=>Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4));
            const aEq=y=>Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));
            const iso=(y,m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

            const now = new Date();
            const tY = now.getFullYear();
            const tM = now.getMonth() + 1;
            const tD = now.getDate();
            const todayIso = iso(tY, tM, tD);

            function getInitialPeriod(closingDay = 10){
                const cd = normalizeClosingDay(closingDay);
                const dim = new Date(tY, tM, 0).getDate();
                const effCd = cd === 0 ? dim : Math.min(cd, dim);
                let m = tD >= effCd + 1 ? tM + 1 : tM;
                let y = tY;
                if (m > 12) {
                    m = 1;
                    y += 1;
                }
                return { year: y, month: m };
            }

            function normalizeClosingDay(v){
                if (v === 0 || v === "0" || v === "end") return 0;
                const n = parseInt(v, 10);
                if (isNaN(n) || n < 1 || n > 28) return 10;
                return n;
            }

            function normalizeStepMin(v){
                const n = parseInt(v, 10);
                if ([1, 5, 10, 15, 30].includes(n)) return n;
                if (!isNaN(n) && n >= 1 && n <= 60) return n;
                return 10;
            }

            const DEF = {
                year: tY,
                month: tM,
                closingDay: 10,
                stepMin: 10,
                rates: { weekday: 1220, holiday: 1320, special: 1420 },
                specialRanges: [],
                entries: {},
                periodManuals: {},
                rateMode: "auto",
                fixedRate: 4.8,
                deductions: [{ id: "d1", name: "差引項目A", amount: 0 }]
            };

            const hCache={};

            function isHol(y,m,d){
                if(!hCache[y]){
                    const s=new Set("1-1,2-11,2-23,4-29,5-3,5-4,5-5,8-11,11-3,11-23".split(",").map(x=>{const p=x.split("-");return iso(y,+p.at(0),+p.at(1));}));
                    s.add(iso(y,1,nthW(y,1,1,2)));s.add(iso(y,3,vEq(y)));s.add(iso(y,7,nthW(y,7,1,3)));
                    s.add(iso(y,9,nthW(y,9,1,3)));s.add(iso(y,9,aEq(y)));s.add(iso(y,10,nthW(y,10,1,2)));
                    const f=new Set(s);
                    s.forEach(k=>{const p=k.split("-").map(Number);if(new Date(p.at(0),p.at(1)-1,p.at(2)).getDay()===0){let n=new Date(p.at(0),p.at(1)-1,p.at(2)+1);while(f.has(iso(n.getFullYear(),n.getMonth()+1,n.getDate())))n.setDate(n.getDate()+1);f.add(iso(n.getFullYear(),n.getMonth()+1,n.getDate()));}});
                    for(let mm=1;mm<=12;mm++){const dm=new Date(y,mm,0).getDate();for(let dd=1;dd<=dm;dd++){const c=iso(y,mm,dd);if(!f.has(c)){const p=new Date(y,mm-1,dd-1),n=new Date(y,mm-1,dd+1);if(f.has(iso(p.getFullYear(),p.getMonth()+1,p.getDate()))&&f.has(iso(n.getFullYear(),n.getMonth()+1,n.getDate())))f.add(c);}}}
                    hCache[y]=f;
                }
                return hCache[y].has(iso(y,m,d));
            }

            function dayInfo(y,m,d,ent,rs){
                const dow=new Date(y,m-1,d).getDay(),hol=isHol(y,m,d),md=m*100+d;
                const sp=rs.some(r=>{const s=+r.startMonth*100+ +r.startDay,e=+r.endMonth*100+ +r.endDay;return s&&e&&(s<=e?md>=s&&md<=e:md>=s||md<=e);});
                const auto=sp?"special":(dow===0||dow===6||hol)?"holiday":"weekday";
                const app=ent&&ent.overrideType?ent.overrideType:auto;
                return{dow,hol,app,spBadge:app==="special",holBadge:hol&&app!=="special"};
            }

            function toMin(s){if(!s)return null;const m=s.trim().match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;const h=+m.at(1),mm=+m.at(2);return(h>=0&&h<=29&&mm>=0&&mm<=59)?h*60+mm:null;}

            function normTime(r){
                if(!r)return"";const s=r.trim().replace(/[：．.]/g,":");
                if(s.includes(":")){const p=s.split(":").map(Number);return(!isNaN(p.at(0))&&!isNaN(p.at(1))&&p.at(0)>=0&&p.at(0)<=29&&p.at(1)>=0&&p.at(1)<=59)?`${p.at(0)}:${String(p.at(1)).padStart(2,"0")}`:"";}
                const g=s.replace(/\D/g,"");
                if(g.length===3){const h=+g.at(0),m=+g.slice(1);return m<=59?`${h}:${String(m).padStart(2,"0")}`:"";}
                if(g.length===4){const h=+g.slice(0,2),m=+g.slice(2);return(h<=29&&m<=59)?`${h}:${String(m).padStart(2,"0")}`:"";}
                return"";
            }

            const fmtM=m=>`${Math.floor(Math.max(0,m)/60)}:${String(Math.max(0,m)%60).padStart(2,"0")}`;

            function parseDurMin(raw){
                if(raw===undefined||raw===null)return 0;
                const s=String(raw).trim().replace(/[：．.]/g,":");
                if(!s)return 0;
                if(s.includes(":")){
                    const p=s.split(":").map(Number);
                    if(!isNaN(p[0])&&!isNaN(p[1])&&p[0]>=0&&p[1]>=0&&p[1]<=59)return p[0]*60+p[1];
                    return 0;
                }
                const n=parseInt(s.replace(/\D/g,""),10);
                return isNaN(n)?0:Math.max(0,n);
            }

            function calcDay(ent,rate,stepMin=10){
                if(!ent||!ent.start||!ent.end)return{valid:false,workMin:0,overMin:0,nightMin:0,amount:0};
                const st=toMin(ent.start);let en=toMin(ent.end);if(st===null||en===null)return{valid:false,workMin:0,overMin:0,nightMin:0,amount:0};
                if(en<=st)en+=1440;
                const step=normalizeStepMin(stepMin);
                const span=en-st,brk=Math.max(0,+ent.breakMin||0),work=Math.floor(Math.max(0,span-brk)/step)*step;
                if(work<=0)return{valid:false,workMin:0,overMin:0,nightMin:0,amount:0};
                let rn=0;"0-300,1320-1740,2760-3180".split(",").forEach(t=>{const b=t.split("-").map(Number),x=Math.max(st,b.at(0)),z=Math.min(en,b.at(1));if(z>x)rn+=z-x;});
                const rd=Math.max(0,span-rn),nMin=Math.min(work,Math.floor(Math.max(0,rn-Math.max(0,brk-rd))/step)*step),oMin=Math.max(0,work-480);
                const amt=Math.ceil(Number(((work/60)*rate+(oMin/60)*rate*.25+(nMin/60)*rate*.25).toFixed(6)));
                return{valid:true,workMin:work,overMin:oMin,nightMin:nMin,amount:amt};
            }

            function calcAuto(b){
                if(b<=0)return 0;if(b>=76000&&b<77000)return 2436;if(b<111000)return Math.floor(b*.03063);
                let res=4000;"111000:4000,113000:4100,117000:4200,121000:4300,123000:4400,125000:5100,127000:5300,129000:5500,131000:5700,133000:5900,135000:6200,137000:6500,139000:6800,141000:7000,143000:7400,145000:7700,147000:8000,149000:8300,151000:8600,153000:8900,155000:9200,157000:9500,159000:9800,161000:10100,163000:10400,165000:10700,167000:11000,169000:11300".split(",").forEach(s=>{const p=s.split(":");if(b>=+p.at(0))res=+p.at(1);});
                if(b<=170999)return res;return b<=199999?11600+Math.floor((b-171000)/2000)*350:Math.floor(b*.1021);
            }

            function pDates(y,m,closingDay=10){
                const cd=normalizeClosingDay(closingDay);
                const py=m===1?y-1:y,pm=m===1?12:m-1;
                const prevDim=new Date(py,pm,0).getDate();
                const curDim=new Date(y,m,0).getDate();
                const endD=cd===0?curDim:Math.min(cd,curDim);
                const startD=cd===0?1:Math.min(cd+1,prevDim);
                const a=[];
                if(cd!==0){
                    for(let d=startD;d<=prevDim;d++)a.push({y:py,m:pm,d,iso:iso(py,pm,d)});
                }
                for(let d=1;d<=endD;d++)a.push({y,m,d,iso:iso(y,m,d)});
                return a;
            }

            function periodKeyOfIso(dateIso,closingDay=10){
                const p=dateIso.split("-").map(Number);
                const dy=p.at(0),dm=p.at(1),dd=p.at(2);
                const cd=normalizeClosingDay(closingDay);
                if(cd===0)return `${dy}-${dm}`;
                const dim=new Date(dy,dm,0).getDate();
                const effCd=Math.min(cd,dim);
                let py=dy,pm=dm;
                if(dd>=effCd+1){
                    pm++;
                    if(pm>12){pm=1;py++;}
                }
                return `${py}-${pm}`;
            }

            function sumPeriod(y, m, st) {
                const cd = normalizeClosingDay(st.closingDay);
                const step = normalizeStepMin(st.stepMin);
                const dates = pDates(y, m, cd), cats = { weekday: { l: "平日", c: 0, w: 0, o: 0, n: 0, t: 0 }, holiday: { l: "土日祝", c: 0, w: 0, o: 0, n: 0, t: 0 }, special: { l: "特異日", c: 0, w: 0, o: 0, n: 0, t: 0 } };
                dates.forEach(it => { const e = st.entries[it.iso], inf = dayInfo(it.y, it.m, it.d, e, st.specialRanges), dm = calcDay(e, +st.rates[inf.app] || 0, step); if (dm.valid) { const c = cats[inf.app]; c.c++; c.w += dm.workMin; c.o += dm.overMin; c.n += dm.nightMin; } });
                const pm = (st.periodManuals && st.periodManuals[`${y}-${m}`]) || null;
                let mDays = 0;
                if (pm) {
                    mDays = Math.max(0, parseInt(pm.days, 10) || 0);
                    ["weekday", "holiday", "special"].forEach(k => {
                        if (pm[k]) {
                            cats[k].w += Math.max(0, +pm[k].w || 0);
                            cats[k].o += Math.max(0, +pm[k].o || 0);
                            cats[k].n += Math.max(0, +pm[k].n || 0);
                        }
                    });
                }
                "weekday,holiday,special".split(",").forEach(k => {
                    const c = cats[k], r = +st.rates[k] || 0;
                    const baseAmt = Math.ceil(Number(((c.w / 60) * r).toFixed(6)));
                    const overAmt = Math.ceil(Number(((c.o / 60) * r * 1.25).toFixed(6)));
                    const nightAmt = Math.ceil(Number(((c.n / 60) * r * 1.25).toFixed(6)));
                    c.t = (c.w + c.o + c.n) > 0 ? (baseAmt + overAmt + nightAmt) : 0;
                });
                const tc = cats.weekday.c + cats.holiday.c + cats.special.c + mDays, tw = cats.weekday.w + cats.holiday.w + cats.special.w, to = cats.weekday.o + cats.holiday.o + cats.special.o, tn = cats.weekday.n + cats.holiday.n + cats.special.n, pre = cats.weekday.t + cats.holiday.t + cats.special.t;
                const cDed = st.deductions.reduce((s, d) => s + Math.max(0, +d.amount || 0), 0), base = Math.max(0, pre - cDed);
                let rDed = 0, pct = 0;
                if (st.rateMode === "auto") { rDed = calcAuto(base); pct = base > 0 ? (rDed / base) * 100 : 0; } else { pct = Math.max(0, +st.fixedRate || 0); rDed = Math.floor(base * (pct / 100)); }
                const tDed = cDed + rDed, post = Math.max(0, pre - tDed);
                return { dates, cats, tc, tw, to, tn, pre, cDed, base, rDed, pct, tDed, post };
            }

            function calcRecords(st){
                const cd = normalizeClosingDay(st.closingDay);
                const ks=new Set();
                Object.entries(st.entries).forEach(([k,e])=>{
                    if(!e||!e.start||!e.end)return;
                    ks.add(periodKeyOfIso(k, cd));
                });
                if(st.periodManuals){
                    Object.entries(st.periodManuals).forEach(([pk,pm])=>{
                        if(!pm)return;
                        const hasVal=(+pm.days||0)>0||["weekday","holiday","special"].some(k=>pm[k]&&((+pm[k].w||0)>0||(+pm[k].o||0)>0||(+pm[k].n||0)>0));
                        if(hasVal)ks.add(pk);
                    });
                }
                let cumPre=0, cumPost=0, cumDays=0, cumWork=0;
                ks.forEach(p=>{
                    const q=p.split("-").map(Number),s=sumPeriod(q.at(0),q.at(1),st);
                    cumPre+=s.pre;
                    cumPost+=s.post;
                    cumDays+=s.tc;
                    cumWork+=s.tw;
                });
                return{cumPre,cumPost,cumDays,cumWork};
            }

            function normalizeState(raw){
                const baseDef = JSON.parse(JSON.stringify(DEF));
                if(!raw || typeof raw !== "object") return baseDef;
                const closingDay = normalizeClosingDay(raw.closingDay);
                const stepMin = normalizeStepMin(raw.stepMin);
                return {
                    ...baseDef,
                    ...raw,
                    closingDay,
                    stepMin,
                    rates: { ...baseDef.rates, ...(raw.rates || {}) },
                    specialRanges: Array.isArray(raw.specialRanges) ? raw.specialRanges : [],
                    entries: raw.entries && typeof raw.entries === "object" ? raw.entries : {},
                    periodManuals: raw.periodManuals && typeof raw.periodManuals === "object" ? raw.periodManuals : {},
                    deductions: Array.isArray(raw.deductions) && raw.deductions.length ? raw.deductions : baseDef.deductions
                };
            }

            let appState=(()=>{try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return JSON.parse(JSON.stringify(DEF));return normalizeState(JSON.parse(r));}catch(e){return JSON.parse(JSON.stringify(DEF));}})();

            const save=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));}catch(e){}};
            const note=(m,center=false)=>{toast={msg:m,center};render();clearTimeout(tTimer);tTimer=setTimeout(()=>{toast=null;render();},2200);};
            const fixSel=()=>{const ds=pDates(appState.year,appState.month,appState.closingDay);if(!ds.some(d=>d.iso===selIso))selIso=ds.at(0).iso;};

            let selIso = todayIso, actPanel = null, pPhase = "closed", pTimer = null, openDD = null, spF = { sm: "", sd: "", em: "", ed: "", id: null }, bkTxt = "", restoreJsonInput = "", toast = null, tTimer = null, confirmModal = null;
            let openManual = false;

            const initPeriod = getInitialPeriod(appState.closingDay);
            appState.year = initPeriod.year;
            appState.month = initPeriod.month;
            fixSel();
            if (pDates(appState.year, appState.month, appState.closingDay).some(d => d.iso === todayIso)) {
                selIso = todayIso;
            }

            async function copyJsonToClipboard(jsonStr){
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(jsonStr);
                    return true;
                }
                const ta = document.createElement("textarea");
                ta.value = jsonStr;
                ta.setAttribute("readonly", "");
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand("copy");
                document.body.removeChild(ta);
                return ok;
            }

            async function triggerSave(){
                save();
                const jsonStr = JSON.stringify(appState);
                bkTxt = jsonStr;
                try {
                    await copyJsonToClipboard(jsonStr);
                    note("JSONデータがクリップボードに保存されました", true);
                } catch (e) {
                    render();
                    note("JSONデータがクリップボードに保存されました", true);
                }
            }

            function executeRestore(rawJson){
                const trimmed = (rawJson || "").trim();
                if (!trimmed) {
                    note("JSONデータを貼り付けてください");
                    return;
                }
                try {
                    const parsed = JSON.parse(trimmed);
                    appState = normalizeState(parsed);
                    save();
                    restoreJsonInput = "";
                    bkTxt = trimmed;
                    fixSel();
                    render();
                    note("復元しました");
                } catch (e) {
                    note("JSONデータが正しくありません");
                }
            }

            function executeReset(){
                appState = JSON.parse(JSON.stringify(DEF));
                const pInit = getInitialPeriod(appState.closingDay);
                appState.year = pInit.year;
                appState.month = pInit.month;
                bkTxt = "";
                restoreJsonInput = "";
                spF = { sm: "", sd: "", em: "", ed: "", id: null };
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (e) {}
                fixSel();
                if (pDates(appState.year, appState.month, appState.closingDay).some(d => d.iso === todayIso)) {
                    selIso = todayIso;
                }
                render();
                note("初期化しました");
            }

            function openConfirm(options){
                confirmModal = {
                    message: options.message,
                    onConfirm: options.onConfirm,
                    isDanger: Boolean(options.isDanger),
                    withJsonInput: Boolean(options.withJsonInput),
                    confirmLabel: options.confirmLabel || "実行する"
                };
                render();
            }

            function closeConfirm(){
                confirmModal = null;
                render();
            }

            const chgM=dm=>{let m=appState.month+dm,y=appState.year;if(m<1){m=12;y--;}else if(m>12){m=1;y++;}appState.year=y;appState.month=m;fixSel();openDD=null;save();render();};
            const chgY=dy=>{appState.year+=dy;fixSel();openDD=null;save();render();};

            let panelEls = null;

            function ensurePanelEls() {
                const root = document.getElementById("app");
                if (!root) return null;
                if (!panelEls || !root.contains(panelEls.bd)) {
                    const bd = el("div", "fixed inset-0 top-[49px] z-20 bg-slate-900/45 backdrop-anim opacity-0 pointer-events-none");
                    bd.onclick = clsPanel;
                    const pw = el("div", "fixed left-0 right-0 top-[49px] z-30 max-w-md mx-auto px-2.5 pt-1.5 pointer-events-none");
                    const pc = el("div", "bg-white rounded-2xl shadow-xl border border-slate-200/90 p-3.5 panel-anim panel-entering");
                    pw.append(pc);
                    panelEls = { bd, pw, pc };
                }
                return panelEls;
            }

            function syncPanelDOM(sum, rec = calcRecords(appState)) {
                const els = ensurePanelEls();
                if (!els) return;
                const { bd, pw, pc } = els;
                if (!bd.parentElement) document.getElementById("app").append(bd, pw);

                const active = Boolean(actPanel && pPhase !== "closed");
                if (actPanel && pPhase !== "closed") {
                    pc.innerHTML = "";
                    pc.append(buildPanel(sum, rec));
                }

                if (!active) {
                    bd.className = "fixed inset-0 top-[49px] z-20 bg-slate-900/45 backdrop-anim opacity-0 pointer-events-none";
                    pc.className = "bg-white rounded-2xl shadow-xl border border-slate-200/90 p-3.5 panel-anim panel-entering";
                    return;
                }

                const isOpen = pPhase === "open";
                bd.className = `fixed inset-0 top-[49px] z-20 bg-slate-900/45 backdrop-anim ${isOpen ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"}`;
                pc.className = `bg-white rounded-2xl shadow-xl border border-slate-200/90 p-3.5 panel-anim ${isOpen ? "panel-open" : pPhase === "entering" ? "panel-entering" : "panel-closing"}`;
            }

            function togPanel(t) {
                clearTimeout(pTimer);
                openDD = null;
                if (actPanel === t && (pPhase === "open" || pPhase === "entering")) {
                    clsPanel();
                    return;
                }
                actPanel = t;
                pPhase = "entering";
                render();
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    if (actPanel === t && pPhase === "entering") {
                        pPhase = "open";
                        syncPanelDOM(sumPeriod(appState.year, appState.month, appState));
                        renderHeaderButtons();
                    }
                }));
            }

            function clsPanel() {
                if (!actPanel || pPhase === "closing" || pPhase === "closed") return;
                pPhase = "closing";
                syncPanelDOM(sumPeriod(appState.year, appState.month, appState));
                renderHeaderButtons();
                pTimer = setTimeout(() => {
                    actPanel = null;
                    pPhase = "closed";
                    syncPanelDOM(sumPeriod(appState.year, appState.month, appState));
                }, 900);
            }

            const updEnt=p=>{appState.entries[selIso]={...(appState.entries[selIso]||{start:"",end:"",breakMin:60,overrideType:null}),...p};save();render();};
            document.addEventListener("pointerdown",e=>{if(openDD&&!e.target.closest("[data-dd]")){openDD=null;render();}});
            const el=(tag,cls="",txt="",at={})=>{const d=document.createElement(tag);if(cls)d.className=cls;if(txt!=="")d.textContent=txt;Object.entries(at).forEach(([k,v])=>d.setAttribute(k,v));return d;};
            function buildTimeDD(t,cur){
                const step = normalizeStepMin(appState.stepMin);
                const p=cur.split(":"),ch=p.length===2?+p.at(0):9,cm=p.length===2?+p.at(1):0;
                const wrap=el("div","absolute top-full left-0 right-0 w-full mt-1 z-40 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden box-border");
